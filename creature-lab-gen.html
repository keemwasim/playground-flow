<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="design-system/styles.css">
<style>
body{margin:0;background:#FBFBFD;font-family:'Manrope',system-ui;padding:40px}
h1{font:700 26px 'Sora';letter-spacing:-.02em;color:#111;margin:0 0 6px}
.sub{font:500 13px 'Manrope';color:rgba(0,0,0,.55);margin-bottom:30px;max-width:640px}
.row{display:flex;gap:26px;flex-wrap:wrap}
.cell{width:300px}
.tag{font:700 13px 'Manrope';letter-spacing:0;color:rgba(0,0,0,.45);text-transform:lowercase;margin-bottom:8px}
.plate{width:300px;height:300px;border-radius:20px;overflow:hidden;background:#FFF;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 14px 34px -18px rgba(0,0,0,.3)}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.note{font:500 12px/1.5 'Manrope';color:rgba(0,0,0,.55);margin-top:10px}
.sizes{display:flex;align-items:flex-end;gap:14px;margin-top:12px}
.sizes img{background:#FFF;border-radius:8px;object-fit:cover}
.night{background:#0D1024;padding:14px;border-radius:12px;margin-top:12px;display:flex;gap:12px;align-items:flex-end}
.night img{border-radius:8px;object-fit:cover;mix-blend-mode:normal}
</style></head><body>
<h1>creature candidates</h1>
<div class="sub">four generated pebbles, shown at plate size, then at the sizes the app actually uses (112px in the room, 72px in the talk, 40px small), and on the night room ground. the current CSS creature is the fallback either way.</div>
<div class="row">
  <div class="cell">
    <div class="tag">A</div>
    <div class="plate"><img src="creature-candidates/pebble_A.png"></div>

      <img src="creature-candidates/pebble_A.png" width="112" height="112">
      <img src="creature-candidates/pebble_A.png" width="72" height="72">
      <img src="creature-candidates/pebble_A.png" width="40" height="40">
    </div>
    <div class="night">
      <img src="creature-candidates/pebble_A.png" width="112" height="112">
