<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="design-system/styles.css">
<style>
html,body{margin:0;padding:0;background:var(--surface-desktop)}
*{box-sizing:border-box}
body{padding:var(--space-7) var(--screen-gutter) var(--space-7);font-family:var(--font-ui);color:var(--text-primary);-webkit-font-smoothing:antialiased}
h1{font:var(--text-sheet-title);letter-spacing:var(--tracking-display);margin:0 0 var(--space-1)}
.sub{font:var(--text-body);color:var(--text-secondary);margin:0 0 var(--space-6)}
</style>
</helmet>
<div>
  <h1>empty states</h1>
  <p class="sub">three quiet degrees of absence</p>

  <div style="display:none">
    <x-import component-from-global-scope="PG.EmptyState" from="./design-system/components/Scaffold.jsx" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.ScreenHeader" from="./design-system/components/Scaffold.jsx" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.Sprite" from="./design-system/components/Sprite.jsx" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.Globe" from="./design-system/components/Globe.jsx" hint-size="10px,10px"></x-import>
  </div>
  <x-import component-from-global-scope="PG.EmptySheet" from="./empty.jsx" hint-size="100%,680px"></x-import>
</div>
</x-dc>
</body>
</html>
