<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;min-height:100%;background:#0B0E20}
*{box-sizing:border-box}
a{color:#F2F2F4}a:hover{color:#AEAEB4}
@keyframes glFadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes glLineIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0px)}}
@keyframes glTwinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes glSpin{0%{background-position:0px 50%}100%{background-position:-1200px 50%}}
@keyframes glBob{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
@keyframes glHalo{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
@keyframes glCloud1{0%,100%{transform:translate(0px,0px)}50%{transform:translate(6px,-5px)}}
@keyframes glCloud2{0%,100%{transform:translate(0px,0px)}50%{transform:translate(-7px,4px)}}
@keyframes glCloud3{0%,100%{transform:translate(0px,0px)}50%{transform:translate(4px,6px)}}
@keyframes glPing{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes glArc{0%{stroke-dashoffset:220}55%,70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes glSoul{0%{transform:translate(0px,30px) scale(.7);opacity:0}18%{opacity:.85}100%{transform:translate(-6px,-44px) scale(1.05);opacity:0}}
@keyframes glWhisper{0%{opacity:0;transform:translateX(-50%) translateY(8px)}14%{opacity:.95;transform:translateX(-50%) translateY(0px)}80%{opacity:.95}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
@keyframes glEnter{0%{transform:scale(.12) translateY(60px);opacity:0}55%{opacity:1}80%{transform:scale(1.04) translateY(-4px)}100%{transform:scale(1) translateY(0px);opacity:1}}
@keyframes glRiseOut{0%{transform:translateY(44px) scale(.7);opacity:0}16%{opacity:.9}70%{opacity:.7}100%{transform:translateY(-166px) scale(1.08);opacity:0}}
@keyframes glSpinLand{0%{transform:translateX(0%)}100%{transform:translateX(-50%)}}
@keyframes glDriftHint{0%,100%{transform:translateY(4px);opacity:.15}50%{transform:translateY(-4px);opacity:.45}}
@keyframes glLogoIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes glLogoOpen{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.6)}}
@keyframes glLogoWink{0%,74%,100%{transform:scaleY(1)}80%,86%{transform:scaleY(.1)}}
</style>
</helmet>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:34px 0; background:radial-gradient(120% 100% at 50% 0%, #1A1F33 0%, #0B0E20 100%); font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;">
  <div style="position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:999; pointer-events:none; font:500 11px 'Manrope', system-ui, sans-serif; letter-spacing:.02em; color:rgba(255,255,255,.75); background:rgba(10,10,14,.6); padding:5px 13px; border-radius:999px; white-space:nowrap;">archived — color-globe exploration, superseded by the three ruled Globe treatments (eclipse · souls · relief)</div>
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="430px,900px">
    <div ref="{{ scrRef }}" onPointerDown="{{ onDown }}" onPointerUp="{{ onUp }}" data-screen-label="The other side — globe" style="position:absolute; inset:0; overflow:hidden; touch-action:none; -webkit-font-smoothing:antialiased; background:radial-gradient(130% 100% at 50% 116%, rgba(140,155,255,.14) 0%, transparent 55%), linear-gradient(180deg, #FFFFFF 0%, #FBFBFD 52%, #F1F2F7 100%);">

      <sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; left:0; right:0; bottom:52px; text-align:center; z-index:4; animation:glFadeIn 1.2s ease 2.4s both; pointer-events:none;">
          <div style="font:400 12px 'Manrope', -apple-system, system-ui, sans-serif; color:{{ inkSoft }}; opacity:.55;">swipe up</div>
          <div style="width:1.5px; height:16px; margin:7px auto 0; border-radius:2px; background:{{ inkSoft }}; opacity:.35; animation:glDriftHint 2.2s ease-in-out infinite;"></div>
        </div>
      </sc-if>

      <!-- stars -->
      <div style="position:absolute; top:0; left:0; width:1px; height:1px; border-radius:50%; animation:glTwinkle 8s ease-in-out infinite; box-shadow:52px 130px 0 0 rgba(115,125,175,.5), 140px 84px 0 .5px rgba(215,225,255,.4), 235px 150px 0 0 rgba(115,125,175,.45), 320px 90px 0 0 rgba(115,125,175,.3), 90px 250px 0 0 rgba(115,125,175,.35), 300px 260px 0 .5px rgba(215,225,255,.35), 200px 620px 0 0 rgba(115,125,175,.3), 90px 700px 0 0 rgba(115,125,175,.35), 330px 680px 0 .5px rgba(215,225,255,.35), 250px 740px 0 0 rgba(115,125,175,.3), 60px 560px 0 0 rgba(115,125,175,.25), 350px 550px 0 0 rgba(115,125,175,.3);"></div>
      <div style="position:absolute; top:0; left:0; width:1px; height:1px; border-radius:50%; animation:glTwinkle 12s ease-in-out -4s infinite; box-shadow:110px 170px 0 0 rgba(115,125,175,.25), 260px 210px 0 0 rgba(115,125,175,.3), 180px 100px 0 0 rgba(115,125,175,.25), 40px 380px 0 0 rgba(115,125,175,.28), 340px 400px 0 0 rgba(115,125,175,.22), 150px 780px 0 0 rgba(115,125,175,.28);"></div>

      <!-- globe -->
      <div style="position:absolute; left:50%; top:44%; width:0; height:0; z-index:3;">
        <!-- the globe is born from the logo's counter -->
        <div style="position:absolute; left:0; top:0; width:56px; height:62px; transform:translate(-50%,-50%); animation:glLogoIn .5s cubic-bezier(.2,.8,.2,1) both, glLogoOpen .65s cubic-bezier(.6,.05,.4,1) 1.5s both; pointer-events:none; z-index:2;">
          <svg width="56" viewBox="0 0 120 132" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="color:{{ logoInk }}; display:block;">
            <rect x="26" y="16" width="30" height="104" rx="15" fill="currentColor"></rect>
            <circle cx="66" cy="52" r="40" fill="currentColor"></circle>
            <circle cx="72" cy="52" r="17" fill="#3E97EC" style="transform-origin:72px 52px; animation:glLogoWink 1.5s ease-in-out both;"></circle>
          </svg>
        </div>
        <div style="position:absolute; left:50%; top:50%; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(90,160,255,.5) 0%, rgba(90,160,255,.16) 45%, transparent 68%); filter:blur(14px); animation:glFadeIn 1.4s ease 1.9s both, glHalo 6s ease-in-out 3.3s infinite;"></div>
        <div style="animation:glBob 7s ease-in-out infinite;">
          <div onClick="{{ onGlobeTap }}" style="position:relative; width:250px; height:250px; margin:-125px 0 0 -125px; cursor:pointer; animation:glEnter 1.2s cubic-bezier(.2,.9,.25,1.1) 1.55s both;">
            <!-- souls rise out of the globe, past the rim -->
            <div style="position:absolute; left:30%; top:36%; width:6px; height:12px; border-radius:50%; background:#EAF2FF; box-shadow:0 0 10px rgba(120,170,255,.9); filter:blur(1.5px); animation:glRiseOut 7s ease-in-out 2.8s infinite;"></div>
            <div style="position:absolute; left:60%; top:42%; width:5px; height:9px; border-radius:50%; background:#F2F7FF; box-shadow:0 0 9px rgba(120,170,255,.85); filter:blur(1.5px); animation:glRiseOut 9.5s ease-in-out 5.4s infinite;"></div>
            <div style="position:absolute; left:45%; top:40%; width:4px; height:8px; border-radius:50%; background:#E2ECFF; box-shadow:0 0 8px rgba(120,170,255,.8); filter:blur(1.5px); animation:glRiseOut 11s ease-in-out 7.8s infinite;"></div>
            <div style="position:absolute; inset:0; border-radius:50%; overflow:hidden; background:radial-gradient(circle at 36% 30%, #7CC8FF 0%, #3E97EC 42%, #1B6BD0 72%, #0E4BA6 100%); box-shadow:0 0 46px rgba(90,160,255,.55), 0 0 120px rgba(80,140,255,.28);">
              <div style="position:absolute; top:0; bottom:0; left:0; width:200%; animation:glSpinLand {{ spinS }}s linear infinite;">
                <div style="position:absolute; left:0; top:0; width:50%; height:100%;">
                  <div style="position:absolute; left:8%; top:14%; width:17%; height:15%; border-radius:52% 48% 45% 55% / 48% 54% 46% 52%; background:radial-gradient(circle at 35% 28%, #57D488, #1E9C4E 75%); box-shadow:inset -3px -5px 9px rgba(10,80,40,.35);"></div>
                  <div style="position:absolute; left:34%; top:26%; width:26%; height:23%; border-radius:48% 52% 55% 45% / 52% 46% 54% 48%; background:radial-gradient(circle at 35% 28%, #57D488, #1E9C4E 75%); box-shadow:inset -4px -6px 10px rgba(10,80,40,.35);"></div>
                  <div style="position:absolute; left:14%; top:52%; width:22%; height:27%; border-radius:50% 50% 46% 54% / 55% 45% 52% 48%; background:radial-gradient(circle at 35% 28%, #FFC06A, #EE8A2A 75%); box-shadow:inset -4px -6px 10px rgba(150,70,10,.3);"></div>
                  <div style="position:absolute; left:58%; top:58%; width:18%; height:17%; border-radius:46% 54% 52% 48% / 50% 50% 48% 52%; background:radial-gradient(circle at 35% 28%, #57D488, #1E9C4E 75%); box-shadow:inset -3px -5px 9px rgba(10,80,40,.35);"></div>
                  <div style="position:absolute; left:74%; top:20%; width:14%; height:16%; border-radius:52% 48% 50% 50% / 48% 52% 50% 50%; background:radial-gradient(circle at 35% 28%, #FFC06A, #EE8A2A 75%); box-shadow:inset -3px -4px 8px rgba(150,70,10,.3);"></div>
                  <div style="position:absolute; left:26%; top:20%; width:9%; height:4.5%; border-radius:50%; background:#FFFFFF; opacity:.92;"></div>
                  <div style="position:absolute; left:64%; top:42%; width:11%; height:5%; border-radius:50%; background:#FFFFFF; opacity:.85;"></div>
                  <div style="position:absolute; left:40%; top:72%; width:9%; height:4.5%; border-radius:50%; background:#FFFFFF; opacity:.88;"></div>
                </div>
                <div style="position:absolute; left:50%; top:0; width:50%; height:100%;">
                  <div style="position:absolute; left:8%; top:14%; width:17%; height:15%; border-radius:52% 48% 45% 55% / 48% 54% 46% 52%; background:radial-gradient(circle at 35% 28%, #57D488, #1E9C4E 75%); box-shadow:inset -3px -5px 9px rgba(10,80,40,.35);"></div>
                  <div style="position:absolute; left:34%; top:26%; width:26%; height:23%; border-radius:48% 52% 55% 45% / 52% 46% 54% 48%; background:radial-gradient(circle at 35% 28%, #57D488, #1E9C4E 75%); box-shadow:inset -4px -6px 10px rgba(10,80,40,.35);"></div>
                  <div style="position:absolute; left:14%; top:52%; width:22%; height:27%; border-radius:50% 50% 46% 54% / 55% 45% 52% 48%; background:radial-gradient(circle at 35% 28%, #FFC06A, #EE8A2A 75%); box-shadow:inset -4px -6px 10px rgba(150,70,10,.3);"></div>
                  <div style="position:absolute; left:58%; top:58%; width:18%; height:17%; border-radius:46% 54% 52% 48% / 50% 50% 48% 52%; background:radial-gradient(circle at 35% 28%, #57D488, #1E9C4E 75%); box-shadow:inset -3px -5px 9px rgba(10,80,40,.35);"></div>
                  <div style="position:absolute; left:74%; top:20%; width:14%; height:16%; border-radius:52% 48% 50% 50% / 48% 52% 50% 50%; background:radial-gradient(circle at 35% 28%, #FFC06A, #EE8A2A 75%); box-shadow:inset -3px -4px 8px rgba(150,70,10,.3);"></div>
                  <div style="position:absolute; left:26%; top:20%; width:9%; height:4.5%; border-radius:50%; background:#FFFFFF; opacity:.92;"></div>
                  <div style="position:absolute; left:64%; top:42%; width:11%; height:5%; border-radius:50%; background:#FFFFFF; opacity:.85;"></div>
                  <div style="position:absolute; left:40%; top:72%; width:9%; height:4.5%; border-radius:50%; background:#FFFFFF; opacity:.88;"></div>
                </div>
              </div>
              <div style="position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.5), transparent 40%), radial-gradient(circle at 50% 50%, transparent 55%, rgba(10,30,90,.35) 82%, rgba(6,18,60,.6) 100%); pointer-events:none;"></div>
            </div>
            <!-- clouds -->
            <div style="position:absolute; left:-26px; top:38px; width:44px; height:18px; border-radius:12px; background:linear-gradient(180deg, #FFFFFF, #D9DCE8); box-shadow:0 4px 10px rgba(8,10,26,.4); animation:glCloud1 9s ease-in-out infinite;"></div>
            <div style="position:absolute; right:-30px; top:96px; width:52px; height:20px; border-radius:13px; background:linear-gradient(180deg, #FFFFFF, #D3D6E4); box-shadow:0 4px 10px rgba(8,10,26,.4); animation:glCloud2 11s ease-in-out infinite;"></div>
            <div style="position:absolute; left:18px; bottom:-14px; width:38px; height:16px; border-radius:11px; background:linear-gradient(180deg, #FFFFFF, #DDE0EA); box-shadow:0 4px 10px rgba(8,10,26,.4); animation:glCloud3 10s ease-in-out infinite;"></div>
            <div style="position:absolute; right:6px; top:-16px; width:30px; height:13px; border-radius:9px; background:linear-gradient(180deg, #FFFFFF, #D9DCE8); box-shadow:0 4px 10px rgba(8,10,26,.4); animation:glCloud2 12s ease-in-out -3s infinite;"></div>
            <!-- pins -->
            <sc-for list="{{ pins }}" as="p" hint-placeholder-count="0">
              <div onClick="{{ p.onTap }}" style="position:absolute; left:{{ p.x }}%; top:{{ p.y }}%; width:0; height:0; cursor:pointer;">
                <div style="position:absolute; left:-11px; top:-11px; width:22px; height:22px; border-radius:50%; border:1.5px solid {{ p.ring }}; animation:glPing 2.8s ease-out {{ p.delay }}s infinite;"></div>
                <div style="position:absolute; left:-5px; top:-5px; width:10px; height:10px; border-radius:{{ p.r }}; transform:rotate(45deg); background:{{ p.bg }}; box-shadow:0 0 10px {{ p.glowC }}, 0 2px 5px rgba(8,10,26,.5);"></div>
                <sc-if value="{{ p.label }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute; left:50%; top:12px; transform:translateX(-50%); white-space:nowrap; font:600 13px ui-monospace, Menlo, monospace; letter-spacing:0; color:#1C2140; background:rgba(255,255,255,.78); backdrop-filter:blur(10px); padding:3px 8px; border-radius:999px; box-shadow:0 0 0 1px rgba(0,0,0,.12), 0 2px 8px rgba(20,26,60,.15);">{{ p.label }}</div>
                </sc-if>
              </div>
            </sc-for>
            <!-- trip arc -->
            <sc-if value="{{ arcOn }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 250 250" style="position:absolute; inset:0; overflow:visible; pointer-events:none;">
                <path d="M 26 190 Q 125 -30 224 148" fill="none" stroke="rgba(115,125,175,.75)" stroke-width="1.5" stroke-dasharray="3 5" style="animation:glArc 5.5s ease-in-out infinite;"></path>
              </svg>
            </sc-if>
          </div>
        </div>
        <!-- whisper -->
        <sc-if value="{{ whisper }}" hint-placeholder-val="{{ false }}">
          <div key="{{ whisper.k }}" style="position:absolute; left:50%; top:-190px; transform:translateX(-50%); width:max-content; max-width:260px; text-align:center; font:400 13px/1.55 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color:{{ inkSoft }}; animation:glWhisper 3.6s ease both;">{{ whisper.text }}</div>
        </sc-if>
      </div>


    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:940},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Daylight&quot;,&quot;options&quot;:[&quot;Daylight&quot;,&quot;Night&quot;],&quot;section&quot;:&quot;Globe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;spinSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:20,&quot;max&quot;:120,&quot;step&quot;:5,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Globe&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  scrRef = React.createRef();
  state = { mode: 0, whisper: null, wk: 0, hinted: false };
  onDown = (e) => { this._sy = e.clientY; };
  onUp = (e) => {
    if (this._sy == null) return;
    const dy = e.clientY - this._sy; this._sy = null;
    if (dy < -50) this.setState(s => ({ mode: (s.mode + 1) % this.MODES.length, whisper: null, hinted: true }));
    else if (dy > 50) this.setState(s => ({ mode: (s.mode - 1 + this.MODES.length) % this.MODES.length, whisper: null, hinted: true }));
  };
  componentDidMount() { this._theme = null; this.applyTheme(); }
  componentDidUpdate() { this.applyTheme(); }
  applyTheme() {
    const el = this.scrRef.current; if (!el) return;
    const t = this.props.theme ?? 'Daylight';
    if (this._theme === t) return; this._theme = t;
    el.style.background = t === 'Night'
      ? 'radial-gradient(130% 100% at 50% 116%, rgba(70,90,180,.22) 0%, transparent 55%), linear-gradient(180deg, #0B0C12 0%, #08090E 100%)'
      : 'radial-gradient(130% 100% at 50% 116%, rgba(140,155,255,.14) 0%, transparent 55%), linear-gradient(180deg, #FFFFFF 0%, #FBFBFD 52%, #F1F2F7 100%)';
  }
  MODES = [
    { title: 'Where Sol is tonight', status: 'out \u00B7 trading in the lantern district', arc: true, sol: { x: 62, y: 30 } },
    { title: 'The world, asleep', status: 'Sol is home \u00B7 the commons goes on without you', arc: false, sol: null },
  ];
  WHISPERS = [
    'somewhere down there, two scholars argue about your question',
    'Quill keeps a lantern lit for Sol',
    'the commons is crowded tonight \u2014 word of a sharp question travels',
    'a bargain is being struck in the square',
  ];
  onGlobeTap = () => {
    this.setState(s => ({ whisper: { text: this.WHISPERS[s.wk % this.WHISPERS.length], k: 'w' + Date.now() }, wk: s.wk + 1 }));
  };
  onNext = () => { this.setState(s => ({ mode: (s.mode + 1) % this.MODES.length, whisper: null })); };
  pinTap(label) { return () => this.setState({ whisper: { text: label === 'Quill' ? 'Quill \u00B7 archivist \u00B7 met twice \u2014 she asked about you' : 'an unmet stranger \u2014 send Sol to say hello', k: 'w' + Date.now() } }); }
  renderVals() {
    const m = this.MODES[this.state.mode];
    const pins = [
      { x: 30, y: 62, label: 'Quill', bg: 'linear-gradient(135deg,#E8E9F1,#9FA4B8)', ring: 'rgba(220,225,245,.5)', glowC: 'rgba(220,228,255,.6)', r: '3px', delay: 0, onTap: this.pinTap('Quill') },
      { x: 76, y: 58, label: false, bg: 'linear-gradient(135deg,#B9BECf,#6E7488)', ring: 'rgba(180,188,215,.4)', glowC: 'rgba(180,190,225,.4)', r: '3px', delay: 1.1, onTap: this.pinTap('') },
      { x: 48, y: 78, label: false, bg: 'linear-gradient(135deg,#B9BECf,#6E7488)', ring: 'rgba(180,188,215,.4)', glowC: 'rgba(180,190,225,.4)', r: '3px', delay: 2, onTap: this.pinTap('') },
    ];
    if (m.sol) pins.push({ x: m.sol.x, y: m.sol.y, label: 'Sol', bg: 'radial-gradient(circle at 38% 30%, #FFFFFF, #D9DCE8)', ring: 'rgba(255,255,255,.7)', glowC: 'rgba(235,240,255,.9)', r: '50%', delay: .5, onTap: () => this.setState({ whisper: { text: 'Sol \u00B7 trading a page for something rarer', k: 'w' + Date.now() } }) });
    return {
      title: m.title, status: m.status, statusKey: 'st' + this.state.mode,
      scrRef: this.scrRef,
      onDown: this.onDown, onUp: this.onUp,
      showHint: !this.state.hinted,
      spinS: this.props.spinSeconds ?? 55,
      inkSoft: (this.props.theme ?? 'Daylight') === 'Night' ? 'rgba(225,230,250,.8)' : 'rgba(40,48,95,.8)',
      pins, arcOn: m.arc,
      whisper: this.state.whisper,
      onGlobeTap: this.onGlobeTap, onNext: this.onNext,
    };
  }
}
</script>
</body>
</html>
