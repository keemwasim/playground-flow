<title>the globe — portable component</title>
<!--
  the playground globe, keem-approved 2026-07-22 ("i llove the globe").
  self-contained: copy the <style> block plus ONE .globe-wrap block into any
  page, including a claude design .dc file (styles can go in the helmet).

  knobs:
  - size: change --gsize on .globe-wrap (everything scales from it)
  - ground: the component is transparent, drop it on any background.
    on dark grounds swap the drop shadow for the glow (see comment below).
  - speed: the two plSpin durations (20s continents, 30s clouds)
-->
<style>
@keyframes plBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes plPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@keyframes plSpin{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.globe-wrap{--gsize:174px;position:relative;width:calc(var(--gsize)*1.32);height:calc(var(--gsize)*1.32);
  display:flex;align-items:center;justify-content:center;animation:plBob 7s ease-in-out infinite}
.globe-aura{position:absolute;width:calc(var(--gsize)*1.2);height:calc(var(--gsize)*1.2);border-radius:50%;
  background:radial-gradient(circle, rgba(50,150,255,.32), rgba(40,140,255,0) 68%);
  filter:blur(6px);animation:plPulse 4s ease-in-out infinite}
.globe{position:relative;width:var(--gsize);height:var(--gsize);border-radius:50%;overflow:hidden;z-index:2;
  background:radial-gradient(circle at 36% 30%, #58E0FF 0%, #1FB0EE 34%, #1584D6 60%, #0C5AA8 100%);
  /* white/light ground: soft drop shadow */
  box-shadow:0 14px 44px rgba(30,110,200,.35), inset -13px -15px 38px rgba(4,30,70,.75), inset 9px 11px 24px rgba(190,240,255,.4)}
/* dark ground: replace the .globe box-shadow first value with a glow:
   0 0 44px 6px rgba(50,170,255,.6) */
.globe .band{position:absolute;top:0;left:0;height:100%;width:200%;animation:plSpin 20s linear infinite}
.globe .clouds{position:absolute;top:0;left:0;height:100%;width:200%;animation:plSpin 30s linear infinite;z-index:3}
.globe .blob{position:absolute;border-radius:46% 54% 52% 48% / 56% 46% 54% 44%;
  box-shadow:inset 3px 4px 6px rgba(255,255,255,.35), inset -3px -5px 8px rgba(0,40,30,.4)}
.globe .g{background:radial-gradient(circle at 38% 32%, #4FD86E, #1E9440)}
.globe .g2{background:radial-gradient(circle at 38% 32%, #2FBF8A, #178C63)}
.globe .o{background:radial-gradient(circle at 38% 32%, #FFA94D, #EE6E16)}
.globe .cloud{position:absolute;background:#fff;border-radius:50%;filter:blur(1.5px);opacity:.95}

/* demo page only */
html,body{margin:0;height:100%}
.demo{display:flex;height:100vh}
.demo>div{flex:1;display:flex;align-items:center;justify-content:center}
.demo .lite{background:radial-gradient(120% 90% at 50% 42%, #FFFFFF 0%, #F4F6FA 60%, #E9EDF4 100%)}
.demo .dark{background:radial-gradient(120% 90% at 50% 42%, #17171B 0%, #0A0A0D 60%, #000 100%)}
.demo .dark .globe{box-shadow:0 0 44px 6px rgba(50,170,255,.6), inset -13px -15px 38px rgba(4,30,70,.75), inset 9px 11px 24px rgba(190,240,255,.4)}
</style>
