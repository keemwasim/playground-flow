<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>descent · review</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0c;font-family:'Manrope',system-ui,sans-serif;color:#ececed;padding:26px 30px 70px}
h1{font:700 20px 'Sora',system-ui;letter-spacing:-.02em;margin:0 0 3px}
.sub{font:500 12px 'Manrope';color:rgba(255,255,255,.45);margin-bottom:20px}
.stage{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.player{width:320px;flex:0 0 320px}
.frame{position:relative;width:320px;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 20px 50px -22px rgba(0,0,0,.7)}
video{width:320px;display:block}
#draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:none}
#draw.on{display:block}
#show{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ctl{display:flex;align-items:center;gap:10px;margin-top:12px}
.pp{background:#ececed;color:#111;border:0;border-radius:9px;width:38px;height:34px;font-size:15px;cursor:pointer}
.tc{font:700 12px ui-monospace,Menlo,monospace;color:#8ab4ff;min-width:74px}
.dtog{margin-left:auto;background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15);border-radius:9px;height:34px;padding:0 12px;font:700 12px 'Manrope';cursor:pointer}
.dtog.on{background:#ff5d5d;color:#fff;border-color:#ff5d5d}
.track{position:relative;height:26px;margin-top:12px;cursor:pointer}
.rail{position:absolute;top:11px;left:0;right:0;height:4px;background:rgba(255,255,255,.14);border-radius:3px}
.played{position:absolute;top:11px;left:0;height:4px;background:#8ab4ff;border-radius:3px;width:0}
.mk{position:absolute;top:5px;width:3px;height:16px;background:#ff5d5d;border-radius:2px;transform:translateX(-1px)}
.panel{flex:1;min-width:340px;max-width:560px}
.add{display:flex;gap:8px}
input{flex:1;background:#161619;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font:500 14px 'Manrope';padding:11px 13px;outline:none}
button.pin{background:#8ab4ff;color:#06122b;border:0;border-radius:10px;font:700 13px 'Manrope';padding:0 15px;cursor:pointer}
.hint{font:500 11.5px 'Manrope';color:rgba(255,255,255,.38);margin:12px 2px 6px}
.cmt{display:flex;gap:11px;padding:11px 10px;border-radius:10px;font:500 13.5px/1.45 'Manrope';cursor:pointer}
.cmt:hover{background:rgba(255,255,255,.04)}
.cmt.active{background:rgba(138,180,255,.12)}
.cmt .t{font:700 11.5px ui-monospace,Menlo,monospace;color:#8ab4ff;flex:0 0 58px;padding-top:1px}
.cmt img{width:44px;border-radius:6px;flex:0 0 44px;align-self:flex-start;border:1px solid rgba(255,255,255,.15)}
.cmt .x{margin-left:auto;color:rgba(255,255,255,.28);font-size:16px;line-height:1}
.bar{display:flex;gap:8px;margin-top:14px}
.gh{background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:9px 13px;font:700 12px 'Manrope';cursor:pointer}
.pens{display:none;gap:6px;margin-top:10px;align-items:center}
.pens.on{display:flex}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.2)}
.sw.sel{border-color:#fff}
</style></head><body>
<h1>descent &middot; review</h1>
<div class="sub">play, pause on a frame, hit DRAW to sketch on it, type a note and PIN. markers land on the timeline. click a marker or a comment to jump. COPY ALL and paste to me.</div>
<div class="stage">
  <div class="player">
    <div class="frame">
      <video id="v" src="cine/intro-latest.mp4" playsinline preload="metadata"></video>
      <canvas id="show"></canvas>
      <canvas id="draw"></canvas>
    </div>
    <div class="ctl">
      <button class="pp" id="pp">&#9658;</button>
      <span class="tc" id="tc">0:00:00</span>
      <button class="dtog" id="dtog">draw</button>
    </div>
    <div class="pens" id="pens">
      <span class="sw sel" style="background:#ff5d5d" data-c="#ff5d5d"></span>
      <span class="sw" style="background:#ffd23f" data-c="#ffd23f"></span>
      <span class="sw" style="background:#8ab4ff" data-c="#8ab4ff"></span>
      <span class="sw" style="background:#ffffff" data-c="#ffffff"></span>
      <button class="gh" id="undo" style="margin-left:6px;padding:5px 10px">clear sketch</button>
    </div>
    <div class="track" id="track"><div class="rail"></div><div class="played" id="played"></div></div>
  </div>
  <div class="panel">
    <div class="add">
      <input id="i" placeholder="note at the current frame, then pin" autocomplete="off">
      <button class="pin" onclick="pin()">pin</button>
    </div>
    <div class="hint">Enter to pin. Space to play/pause. any sketch on the frame attaches to the note.</div>
    <div id="list"></div>
    <div class="bar"><button class="gh" onclick="copyAll()">copy all notes</button><button class="gh" onclick="clearAll()">clear</button></div>
  </div>
</div>
<script>
const v=document.getElementById('v'),tc=document.getElementById('tc'),track=document.getElementById('track'),played=document.getElementById('played'),list=document.getElementById('list'),inp=document.getElementById('i');
const draw=document.getElementById('draw'),show=document.getElementById('show'),dtog=document.getElementById('dtog'),pens=document.getElementById('pens'),pp=document.getElementById('pp');
const FPS=24, KEY='descent_review_v2';
let notes=JSON.parse(localStorage.getItem(KEY)||'[]'), penColor='#ff5d5d', drawing=false, dctx, sctx, last=null, active=-1;
function sizeCanvas(){ [draw,show].forEach(c=>{c.width=v.videoWidth||640;c.height=v.videoHeight||1138;}); dctx=draw.getContext('2d'); sctx=show.getContext('2d'); dctx.lineCap='round';dctx.lineJoin='round'; }
v.addEventListener('loadedmetadata',()=>{sizeCanvas();render();});
const fmt=s=>{s=Math.max(0,s);const m=s/60|0,ss=(s|0)%60,ff=Math.round((s-(s|0))*FPS);return m+':'+String(ss).padStart(2,'0')+':'+String(ff).padStart(2,'0');};
const fmtShort=s=>{const m=s/60|0,ss=(s|0)%60,ff=Math.round((s-(s|0))*FPS);return m+':'+String(ss).padStart(2,'0')+':'+String(ff).padStart(2,'0');};
function render(){
  notes.sort((a,b)=>a.t-b.t);
  [...track.querySelectorAll('.mk')].forEach(e=>e.remove());
  const dur=v.duration||1;
  notes.forEach(n=>{const d=document.createElement('div');d.className='mk';d.style.left=(n.t/dur*100)+'%';d.title=n.txt;d.onclick=e=>{e.stopPropagation();seek(n.t);};track.appendChild(d);});
  list.innerHTML=notes.length?notes.map((n,i)=>`<div class="cmt${i===active?' active':''}" onclick="seek(${n.t})"><span class="t">${fmtShort(n.t)}</span>${n.draw?`<img src="${n.draw}">`:''}<span>${n.txt.replace(/</g,'&lt;')}</span><span class="x" onclick="event.stopPropagation();del(${i})">&times;</span></div>`).join(''):'<div class="hint">no notes yet.</div>';
  localStorage.setItem(KEY,JSON.stringify(notes));
}
function pin(){const txt=inp.value.trim();if(!txt&&isBlank())return;const d=isBlank()?null:draw.toDataURL('image/png');notes.push({t:v.currentTime,txt:txt||'(sketch)',draw:d});inp.value='';clearSketch();render();}
function del(i){notes.splice(i,1);render();}
function seek(t){v.currentTime=t;showAt(t);}
function clearAll(){if(confirm('clear all notes?')){notes=[];render();}}
function copyAll(){const txt=notes.map(n=>`[${fmtShort(n.t)}] ${n.txt}`).join('\n')||'(no notes)';navigator.clipboard.writeText(txt).then(()=>{const b=event.target,o=b.textContent;b.textContent='copied ✓';setTimeout(()=>b.textContent=o,1100);});}
function isBlank(){const c=draw;const x=dctx.getImageData(0,0,c.width,c.height).data;for(let i=3;i<x.length;i+=40)if(x[i])return false;return true;}
function clearSketch(){dctx&&dctx.clearRect(0,0,draw.width,draw.height);}
function showAt(t){sctx&&sctx.clearRect(0,0,show.width,show.height);let cur=-1;for(let i=0;i<notes.length;i++){if(Math.abs(notes[i].t-t)<0.35){cur=i;}}if(cur>=0&&notes[cur].draw){const im=new Image();im.onload=()=>sctx.drawImage(im,0,0,show.width,show.height);im.src=notes[cur].draw;}if(cur!==active){active=cur;render();}}
v.addEventListener('timeupdate',()=>{const d=v.duration||1;played.style.width=(v.currentTime/d*100)+'%';tc.textContent=fmt(v.currentTime);showAt(v.currentTime);});
track.addEventListener('click',e=>{const r=track.getBoundingClientRect();seek((e.clientX-r.left)/r.width*(v.duration||0));});
pp.onclick=()=>{v.paused?v.play():v.pause();};
v.addEventListener('play',()=>pp.innerHTML='&#10073;&#10073;');v.addEventListener('pause',()=>pp.innerHTML='&#9658;');
dtog.onclick=()=>{const on=draw.classList.toggle('on');dtog.classList.toggle('on',on);pens.classList.toggle('on',on);if(on)v.pause();};
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{penColor=s.dataset.c;document.querySelectorAll('.sw').forEach(o=>o.classList.remove('sel'));s.classList.add('sel');});
document.getElementById('undo').onclick=clearSketch;
function pos(e){const r=draw.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return[cx/r.width*draw.width,cy/r.height*draw.height];}
function dstart(e){drawing=true;last=pos(e);e.preventDefault();}
function dmove(e){if(!drawing)return;const p=pos(e);dctx.strokeStyle=penColor;dctx.lineWidth=6;dctx.beginPath();dctx.moveTo(last[0],last[1]);dctx.lineTo(p[0],p[1]);dctx.stroke();last=p;e.preventDefault();}
function dend(){drawing=false;}
draw.addEventListener('mousedown',dstart);draw.addEventListener('mousemove',dmove);window.addEventListener('mouseup',dend);
draw.addEventListener('touchstart',dstart);draw.addEventListener('touchmove',dmove);window.addEventListener('touchend',dend);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')pin();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement!==inp){e.preventDefault();v.paused?v.play():v.pause();}});
</script>
</body></html>
