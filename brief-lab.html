<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<link rel="stylesheet" href="design-system/styles.css">
<style>
  :root { --brief-phone-w: 320px; --brief-phone-h: 680px; }
  html, body { margin: 0; min-height: 100%; background: var(--surface-desktop); }
  * { box-sizing: border-box; }
  body { padding: 48px 32px 72px; color: var(--text-primary); font-family: var(--font-ui); }
  h1 { margin: 0 0 7px; font: var(--text-screen-title); letter-spacing: var(--tracking-display); }
  .sub { margin: 0 0 34px; font: var(--text-body); color: var(--text-secondary); }
  .row { display: flex; align-items: flex-start; gap: 28px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; gap: 12px; }
  .tag { font: var(--text-mono-tag); color: var(--text-secondary); }
  .phone { position: relative; width: var(--brief-phone-w); height: var(--brief-phone-h); overflow: hidden; border-radius: var(--radius-frame); background: var(--paper-card); box-shadow: var(--paper-ring), var(--shadow-panel); }
  .brief-travelling-sprite { animation: briefWalk 3.6s var(--ease-travel) infinite; }
  @keyframes briefWalk {
    0%, 12% { top: 552px; transform: translate(-50%, -50%) scale(1); }
    70% { top: 362px; transform: translate(-50%, -50%) scale(.82); }
    100% { top: 302px; transform: translate(-50%, -50%) scale(.12); opacity: 0; }
  }
  @media (max-width: 1080px) { body { padding: 28px 20px 56px; } .row { gap: 22px; } }
  @media (prefers-reduced-motion: reduce) { .brief-travelling-sprite { animation: none; } }
</style>
</head>
<body>
<h1>brief / send-off</h1>
<div style="display:none;">
  <x-import component-from-global-scope="PG.GoalArea" from="./design-system/components/Field.jsx?v=0729a" hint-size="10px,10px"></x-import>
  <x-import component-from-global-scope="PG.Chip" from="./design-system/components/Chip.jsx?v=0729a" hint-size="10px,10px">x</x-import>
  <x-import component-from-global-scope="PG.Segmented" from="./design-system/components/Chip.jsx?v=0729a" hint-size="10px,10px">x</x-import>
  <x-import component-from-global-scope="PG.Sprite" from="./design-system/components/Sprite.jsx?v=0729a" hint-size="10px,10px"></x-import>
  <x-import component-from-global-scope="PG.Tear" from="./design-system/components/Tear.jsx?v=0729a" hint-size="10px,10px"></x-import>
</div>
<div class="row">
  <div class="cell">
    <div class="tag">01 / the ask</div>
    <div class="phone"><x-import component-from-global-scope="PG.BriefGoal" from="./brief.jsx?v=0729a" hint-size="320px,680px"></x-import></div>
  </div>
  <div class="cell">
    <div class="tag">02 / pack</div>
    <div class="phone"><x-import component-from-global-scope="PG.BriefPack" from="./brief.jsx?v=0729a" hint-size="320px,680px"></x-import></div>
  </div>
  <div class="cell">
    <div class="tag">03 / send-off</div>
    <div class="phone"><x-import component-from-global-scope="PG.BriefSendoff" from="./brief.jsx?v=0729a" hint-size="320px,680px"></x-import></div>
  </div>
</div>
</body>
</html>
