<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="design-system/styles.css">
<style>
  html,body{margin:0;background:var(--surface-desktop);font-family:var(--font-ui);color:var(--text-primary)}
  *{box-sizing:border-box}
  .talk-lab{padding:40px 40px 100px}
  h1{font:var(--text-sheet-title);letter-spacing:-.01em;margin:0 0 6px}
  .sub{font:var(--text-body);color:var(--text-secondary);max-width:560px;margin:0 0 32px}
  .variants{display:grid;grid-template-columns:repeat(3,320px);gap:32px;align-items:start}
  .tag{font:var(--text-mono-tag);letter-spacing:var(--tracking-mono-tag);color:var(--text-secondary);text-transform:lowercase;margin-bottom:8px}
  .note{font:var(--text-body);color:var(--text-secondary);min-height:44px;margin:0 0 14px}
  .ph{position:relative;width:320px;height:680px;border-radius:var(--radius-frame);overflow:hidden;background:var(--bg);box-shadow:var(--paper-ring),var(--shadow-panel)}
  .contact-sheet{display:grid;grid-template-columns:repeat(4,calc(320px * var(--contact-scale)));gap:24px 14px;align-items:start}
  .contact-cell{width:calc(320px * var(--contact-scale))}
  .contact-tag{font:var(--text-mono-tag);letter-spacing:var(--tracking-mono-tag);color:var(--text-secondary);text-transform:lowercase;min-height:30px;margin-bottom:6px}
  .contact-ph{position:relative;width:calc(320px * var(--contact-scale));height:calc(680px * var(--contact-scale));border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:var(--paper-ring),var(--shadow-panel)}
  @media(max-width:1100px){.variants{grid-template-columns:repeat(2,320px)}}
  @media(max-width:700px){.talk-lab{padding:28px 20px 80px}.variants{grid-template-columns:320px}.contact-sheet{grid-template-columns:repeat(2,calc(320px * var(--contact-scale)))}}
</style>
</helmet>
<div style="display:none;">
  <x-import component-from-global-scope="PG.Sprite" from="./design-system/components/Sprite.jsx?v=0730" hint-size="10px,10px"></x-import>
  <x-import component-from-global-scope="PG.Bubble" from="./design-system/components/Bubble.jsx?v=0730" hint-size="10px,10px"></x-import>
  <x-import component-from-global-scope="PG.HatchInput" from="./design-system/components/Field.jsx?v=0730" hint-size="10px,10px"></x-import>
  <x-import component-from-global-scope="PG.Button" from="./design-system/components/Button.jsx?v=0730" hint-size="10px,10px">x</x-import>
  <x-import component-from-global-scope="PG.World" from="./design-system/components/World.jsx?v=0730" hint-size="10px,10px"></x-import>
</div>
<x-import component-from-global-scope="PG.TalkLab" from="./talk.jsx?v=0730" hint-size="1040px,1500px"></x-import>
</x-dc>
</body>
</html>
