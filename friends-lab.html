<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="./support.js"></script>

</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="design-system/styles.css">
<style>
html,body{margin:0;padding:0;background:var(--surface-desktop);color:var(--text-primary);font-family:var(--font-ui)}
*{box-sizing:border-box}
body{padding:40px}
h1{font:var(--text-sheet-title);letter-spacing:var(--tracking-display);margin:0 0 var(--space-2)}
.sub{font:var(--text-body);color:var(--text-secondary);margin:0 0 var(--space-8)}
.lab{display:flex;flex-wrap:wrap;gap:var(--space-10);align-items:flex-start}
.variant{display:flex;flex-direction:column;gap:var(--space-3);align-items:center}
.tag{font:var(--text-mono-tag);letter-spacing:var(--tracking-mono-tag);color:var(--text-tertiary);text-transform:lowercase}
.note{font:var(--text-hint);color:var(--text-secondary);max-width:320px;text-align:center}
.parts{display:flex;align-items:center;gap:var(--space-6);padding:var(--space-5);margin-top:var(--space-10);background:var(--paper-card);border-radius:var(--radius-row-card);box-shadow:var(--paper-ring),var(--shadow-contact)}
</style>
</helmet>

<div>
  <h1>friends</h1>
  <p class="sub">the ones it met out in the world</p>

  <div style="display:none;">
    <x-import component-from-global-scope="PG.SocialFact" from="./design-system/components/Society.jsx?v=0729" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.MiniGlobe" from="./design-system/components/Society.jsx?v=0729" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.AgentMark" from="./design-system/components/Agents.jsx?v=0729" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.FriendDiamond" from="./design-system/components/Desk.jsx?v=0729" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.ListRow" from="./design-system/components/ListRow.jsx?v=0729" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.Section" from="./design-system/components/Scaffold.jsx?v=0729" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.ScreenHeader" from="./design-system/components/Scaffold.jsx?v=0729" title="x" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.EmptyState" from="./design-system/components/Scaffold.jsx?v=0729" hint-size="10px,10px"></x-import>
    <x-import component-from-global-scope="PG.World" from="./design-system/components/World.jsx?v=0729" hint-size="10px,10px"></x-import>
  </div>

  <div class="lab">
    <div class="variant">
      <div class="tag">1 · ON THE WORLD</div>
      <x-import component-from-global-scope="PG.FriendsWorld" from="./friends.jsx?v=127a" hint-size="320px,680px"></x-import>
      <div class="note">friends placed where it met them</div>
    </div>
    <div class="variant">
      <div class="tag">2 · THE ROSTER</div>
      <x-import component-from-global-scope="PG.FriendsRoster" from="./friends.jsx?v=127a" hint-size="320px,680px"></x-import>
      <div class="note">names it carried home</div>
    </div>
    <div class="variant">
      <div class="tag">3 · ONE IN VIEW</div>
      <x-import component-from-global-scope="PG.FriendsSpotlight" from="./friends.jsx?v=127a" hint-size="320px,680px"></x-import>
      <div class="note">one friend, close at hand</div>
    </div>
    <div class="variant">
      <div class="tag">4 · EMPTY</div>
      <x-import component-from-global-scope="PG.FriendsEmpty" from="./friends.jsx?v=127a" hint-size="320px,680px"></x-import>
      <div class="note">before anyone has gathered</div>
    </div>
  </div>

  <div style="margin-top:var(--space-10)">
    <div class="tag">contact sheet</div>
    <x-import component-from-global-scope="PG.FriendsSheet" from="./friends.jsx?v=127a" hint-size="900px,500px"></x-import>
  </div>

  <div class="parts">
    <span class="tag">parts</span>
    <span><x-import component-from-global-scope="PG.AgentMark" from="./design-system/components/Agents.jsx?v=0729" hint-size="38px,38px"></x-import></span>
    <span><x-import component-from-global-scope="PG.FriendDiamond" from="./design-system/components/Desk.jsx?v=0729" hint-size="28px,28px"></x-import></span>
    <x-import component-from-global-scope="PG.SocialFact" from="./design-system/components/Society.jsx?v=0729" hint-size="120px,32px">trusted 92</x-import>
    <x-import component-from-global-scope="PG.SocialFact" from="./design-system/components/Society.jsx?v=0729" hint-size="170px,32px">known in the commons</x-import>
    <x-import component-from-global-scope="PG.MiniGlobe" from="./design-system/components/Society.jsx?v=0729" hint-size="30px,30px"></x-import>
  </div>
</div>
</x-dc>
</body>
</html>
